<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕的海岸骑行</title>
<style>
  :root { color-scheme: light; --ink: #264b51; --paper: #faf5e9; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
  main { width: min(1120px, 100%); padding: 36px 38px 24px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 20px; }
  .eyebrow { font-size: 11px; letter-spacing: .24em; font-weight: 700; color: #72877c; }
  h1 { font-size: clamp(24px, 4vw, 38px); font-weight: 600; letter-spacing: .06em; margin: 9px 0 0; }
  .edition { font-family: Georgia, serif; font-size: 14px; font-style: italic; color: #73877f; }
  .scene { overflow: hidden; border-radius: 24px; background: #f5e8ce; box-shadow: 0 16px 50px #294e4810; border: 1px solid #e8dfcb; }
  svg { display: block; width: 100%; height: auto; }
  footer { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-top: 20px; }
  .caption { font-size: 13px; color: #71837a; line-height: 1.7; margin: 0; }
  .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  button { font: inherit; color: var(--ink); background: transparent; border: 1px solid #bdcdc0; border-radius: 99px; padding: 9px 19px; cursor: pointer; min-width: 100px; }
  button:hover { background: #eaf0e5; }
  button:focus-visible, input:focus-visible { outline: 3px solid #d89549; outline-offset: 4px; }
  label { display: flex; align-items: center; gap: 9px; font-size: 12px; white-space: nowrap; }
  input { width: 88px; accent-color: #368b83; }
  output { min-width: 32px; font-variant-numeric: tabular-nums; }
  @media(max-width: 600px) { main { padding: 24px 14px; } .edition { display: none; } footer { align-items: flex-start; flex-direction: column; gap: 15px; } .scene { border-radius: 16px; } }
</style>
</head>
<body>
<main>

        <path d="M348 470L415 357L478 470M415 357L597 375L478 470M597 375L658 470" stroke="#489d91" stroke-width="7"/>

        <path d="M602 305H621" stroke="#996e53" stroke-width="10"/>
        <path d="M346 470L475 489Q502 485 498 465Q496 448 478 449Z" stroke="#315b56" stroke-width="3"/>
      </g>

        <circle cx="545" cy="151" r="9" fill="#eed8aa"/>
        <circle cx="547" cy="151" r="4" fill="#2d484e"/>
        <circle cx="548" cy="149.5" r="1.2" fill="#fff"/>

  </div>
  <footer>
    <p class="caption">海风刚好，慢慢骑。<br>一只鹈鹕，一辆单车，一段不赶时间的旅程。</p>
    <div class="controls"><button id="toggle" type="button" aria-pressed="false">Ⅱ 暂停</button><label for="speed">骑行速度 <input id="speed" type="range" min="0.4" max="2" step="0.1" value="1"><output id="speed-value" for="speed">1.0×</output></label></div>
  </footer>
</main>
<script>
(() => {
  'use strict';
  const el = id => document.getElementById(id);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let running = !reduced.matches, speed = 1, t = 0, previous = null;
  const toggle = el('toggle');
  function updateButton() {
    toggle.textContent = running ? 'Ⅱ 暂停' : '▶ 播放';
    toggle.setAttribute('aria-pressed', String(!running));
    toggle.setAttribute('aria-label', running ? '暂停骑行动画' : '播放骑行动画');
  }
  toggle.addEventListener('click', () => { running = !running; updateButton(); });
  el('speed').addEventListener('input', e => {
    speed = Number(e.target.value);
    el('speed-value').textContent = speed.toFixed(1) + '×';
  });
  reduced.addEventListener('change', e => { running = !e.matches; updateButton(); });
  document.addEventListener('visibilitychange', () => { previous = null; });
  // Two-link inverse kinematics keeps knees bent and feet attached to the pedals.
  function leg(side, phase, hip) {
    const foot = {x: 478 + 29 * Math.cos(phase), y: 470 + 29 * Math.sin(phase)};
    const ankle = {x: foot.x - 10, y: foot.y - 9};
    const dx = ankle.x - hip.x, dy = ankle.y - hip.y, distance = Math.hypot(dx,dy);
    const upper = 84, lower = 84;
    const along = (upper*upper - lower*lower + distance*distance)/(2*distance);
    const bend = Math.sqrt(Math.max(0, upper*upper-along*along));
    const knee = {x: hip.x + dx*along/distance + dy*bend/distance, y: hip.y + dy*along/distance - dx*bend/distance};
    el('leg-'+side).setAttribute('d', `M${hip.x} ${hip.y}L${knee.x} ${knee.y}L${ankle.x} ${ankle.y}`);
    el('foot-'+side).setAttribute('d', `M${ankle.x} ${ankle.y}Q${foot.x} ${foot.y-3} ${foot.x+14} ${foot.y-5}`);
    el('pedal-'+side).setAttribute('transform', `translate(${foot.x} ${foot.y+2})`);
  }
  function render() {
    const phase = t * 3.6, bob = Math.sin(phase*2)*1.6;
    el('rider').setAttribute('transform', `translate(0 ${bob})`);
    el('rear-wheel').setAttribute('transform', `rotate(${t*125})`);
    el('front-wheel').setAttribute('transform', `rotate(${t*125})`);
    el('crank').setAttribute('transform', `rotate(${phase*180/Math.PI} 478 470)`);
    leg('back', phase+Math.PI, {x:454,y:343});
    leg('front', phase, {x:450,y:346});
    const flap = Math.sin(t*7)*5;
    el('scarf-tail').setAttribute('d', `M508 222C472 225 457 ${204+flap} 430 ${214+flap}L438 ${223+flap}L426 ${232+flap}C458 ${223+flap} 471 243 510 233Z`);
    el('ground').setAttribute('transform', `translate(${-((t*181)%1000)} 0)`);
    el('waves').setAttribute('transform', `translate(${-((t*25)%500)} 0)`);
    el('clouds').setAttribute('transform', `translate(${-((t*9)%1200)} 0)`);
    el('wind1').setAttribute('transform', `translate(${-Math.sin(t*3)*9} 0)`);
    el('wind2').setAttribute('opacity', .4 + .4*Math.sin(t*3+1));
    el('shadow').setAttribute('rx', 218 + bob*2);
  }
  function frame(now) {
    if (previous !== null && running) t += Math.min((now-previous)/1000, .05)*speed;
    previous = now;
    render();
    requestAnimationFrame(frame);
  }
  updateButton(); render(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
