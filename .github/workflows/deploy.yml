name: Deploy to Aliyun Server

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and upload site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.14.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -eu

          test -n "$SERVER_HOST" || { echo "Missing SERVER_HOST"; exit 1; }
          test -n "$SERVER_PORT" || { echo "Missing SERVER_PORT"; exit 1; }
          test -n "$SERVER_SSH_KEY" || { echo "Missing SERVER_SSH_KEY"; exit 1; }

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          if [ -n "$SERVER_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            echo "SERVER_KNOWN_HOSTS is not set; reading the current SSH host key."
            ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Upload dist to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -eu

          test -n "$SERVER_USER" || { echo "Missing SERVER_USER"; exit 1; }
          test -n "$SERVER_PATH" || { echo "Missing SERVER_PATH"; exit 1; }
          test -d dist || { echo "The dist build output does not exist"; exit 1; }

          SSH_OPTIONS="-i $HOME/.ssh/deploy_key -p $SERVER_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2"
          ssh $SSH_OPTIONS "$SERVER_USER@$SERVER_HOST" "command -v rsync >/dev/null 2>&1 || { echo 'Remote rsync is not installed'; exit 1; }; test -d '$SERVER_PATH' || { echo 'Remote deploy directory does not exist'; exit 1; }"
          rsync -az --delete --human-readable --stats \
            -e "ssh $SSH_OPTIONS" \
            dist/ "$SERVER_USER@$SERVER_HOST:${SERVER_PATH%/}/"
